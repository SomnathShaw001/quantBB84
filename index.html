<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <title>BB84 Quantum Key Distribution Research Workbench</title>
  <script>
    // Seamless instant client redirection to frontend workbench
    const target = 'frontend/index.html' + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    :root {
      --bg: #0d1117;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .init-card {
      border: 1px solid var(--border);
      background-color: #161b22;
      padding: 24px 32px;
      border-radius: 4px;
      max-width: 440px;
    }
    .title {
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    a {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="init-card">
    <div class="title">BB84 QUANTUM RESEARCH INSTRUMENT</div>
    <div class="desc">
      Initializing workbench environment...<br>
      <a href="frontend/index.html">Click here if redirect does not start automatically</a>
    </div>
  </div>
</body>
</html>
